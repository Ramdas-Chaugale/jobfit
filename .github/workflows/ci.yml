name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately not installing torch, sentence-transformers or faiss.
      # The tests cover cleaning, filtering and chunking, which is the logic
      # that can break quietly. Pulling two gigabytes of model weights to test
      # a text splitter would make CI slow for no extra coverage.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
